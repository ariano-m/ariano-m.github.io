baseURL: "https://ariano-m.github.io/"
title: Adrián Riaño
theme: PaperMod

pagination:
  pagerSize: 10
  path: posts

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  author: ariano-m
  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  # ShowShareButtons: true

  profileMode:
    enabled: true
    title: Adrián Riaño
    imageUrl: "perfil/perfil.png"
    imageWidth: 180
    imageHeight: 180
    subtitle: "Ingeniero de visión artificial con experiencia liderando el desarrollo software y despliegue de modelos en entornos críticos. Especializado en optimizar sistemas para hardware embebido y recursos limitados, combinando habilidades técnicas con una comunicación clara para convertir problemas complejos en soluciones operativas y robustas."
  
  socialIcons:
    - name: "email"
      url: "mailto:adrianrima98@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/adri%C3%A1n-ria%C3%B1o-8b2427165"
    - name: "github"
      url: "https://github.com/ariano-m"
    - name: "ORCID"
      url: "https://orcid.org/0009-0004-8755-255X"

  # fuseOpts:
  #   isCaseSensitive: false
